<div class="users-page">
    <h2>Editar Usuario</h2>
    @if((loading$ | async)) {
        <div class="loading-container">
            <mat-spinner></mat-spinner>
        </div>
    } @else {
        <section class="edit-user-form">
            <form (ngSubmit)="onSubmit()" [formGroup]="userForm">
                <mat-form-field class="form-field">
                <mat-label>First Name</mat-label>
                <input matInput formControlName="firstName">
                </mat-form-field>

                <mat-form-field class="form-field">
                <mat-label>Last Name</mat-label>
                <input matInput formControlName="lastName">
                </mat-form-field>            

                <mat-form-field class="form-field">
                <mat-label>Email</mat-label>
                <input matInput type="email" formControlName="email">
                </mat-form-field>

                <mat-form-field  class="form-field">
                <mat-label>Phone</mat-label>
                <input matInput type="tel" formControlName="phone">
                </mat-form-field>

                <mat-form-field  class="form-field">
                <mat-label>Role</mat-label>
                <mat-select formControlName="role">
                    <mat-option value="">Select a role</mat-option>
                    <mat-option value="admin">Admin</mat-option>
                    <mat-option value="user">User</mat-option>
                    <mat-option value="moderator">Moderator</mat-option>
                </mat-select>
                </mat-form-field>
                <button mat-button type="submit" [disabled]="userForm.invalid">Guardar</button>
                <button mat-button type="button" (click)="cancelEdit()">Regresar</button>
            </form>
        </section>
    }

</div>
